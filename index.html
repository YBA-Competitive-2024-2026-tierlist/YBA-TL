<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YBA LEGENDS · TIERLIST 2024–2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── INTRO CINEMATIC ── -->
  <div id="intro" aria-hidden="true">
    <p class="intro-line">YBA LEGENDS</p>
    <p class="intro-line intro-line--sub">TIERLIST 2024 – 2026</p>
    <div class="intro-bar"></div>
  </div>

  <!-- ── BACKGROUND ── -->
  <div id="bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-grad"></div>
  </div>

  <!-- ── THEME TOGGLE ── -->
  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
    <span id="theme-icon">☀️</span>
  </button>

  <!-- ── LOADING ── -->
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-ring"></div>
    <p class="loading-txt">LOADING</p>
  </div>

  <!-- ── TOOLTIP ── -->
  <div id="tooltip" role="tooltip" aria-hidden="true">
    <span id="tooltip-name"></span>
    <span id="tooltip-text"></span>
  </div>

  <!-- ── REACT ROOT ── -->
  <div id="root"></div>

  <!-- ── LIBS ── -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- ── VANILLA JS (background + intro + theme) ── -->
  <script src="vanilla.js"></script>

  <!-- ── REACT APP ── -->
  <script type="text/babel" src="app.js"></script>

  

</body>
</html>
