<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YBA LEGENDS · TIERLIST 2024–2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="intro" aria-hidden="true">
    <p class="intro-line">YBA LEGENDS</p>
    <p class="intro-line intro-line--sub">TIERLIST 2024 – 2026</p>
    <div class="intro-bar"></div>
  </div>

  <div id="bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-grad"></div>
  </div>

  <button id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
    <span id="theme-icon">☀️</span>
  </button>

  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-ring"></div>
    <p class="loading-txt">LOADING</p>
  </div>

  <div id="tooltip" role="tooltip" aria-hidden="true">
    <span id="tooltip-name"></span>
    <span id="tooltip-text"></span>
  </div>

  <div id="root"></div>

  <!-- Production React — fast, no dev overhead -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Safety net -->
  <script>
    window.onerror = function(msg, src, line) {
      console.error('[YBA]', msg, src, line);
      var l = document.getElementById('app-loading');
      if (l) l.querySelector('.loading-txt').textContent = 'ERROR — see F12 console';
    };
  </script>

  <script src="vanilla.js"></script>
  <!-- Pure React.createElement — no JSX, no Babel, loads instantly -->
  <script src="app.js"></script>
  <!-- Psst... __ybaEggs.hint() in console -->
  <script src="easter.js" defer></script>

</body>
</html>
